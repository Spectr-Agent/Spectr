<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spectr landing page prototype</title>
<style>
@font-face{font-family:Nunito;font-weight:800;src:url(assets/fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:700;src:url(assets/fonts/nunito-latin-700-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:#E9E2D6;display:flex;flex-direction:column;color:#23262D}
.bar{display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 16px;background:#fff;box-shadow:0 6px 18px rgba(84,64,40,.12);z-index:5;flex-wrap:wrap}
.seg{display:flex;background:#F3EDE2;border-radius:999px;padding:4px;gap:2px}
.seg button,.tg{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:9px 18px;background:transparent;cursor:pointer;color:#5D6470;transition:transform .35s cubic-bezier(.34,1.7,.5,1)}
.seg button.on{background:#23262D;color:#fff}
.seg button:active,.tg:active{transform:scale(.92,.86)}
.tg{background:#F3EDE2;display:flex;align-items:center;gap:10px}
.tg i{width:38px;height:22px;border-radius:12px;background:#C9C3B8;position:relative;transition:background .25s}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.34,1.7,.5,1)}
.tg.on i{background:#6FC3F2}.tg.on i::after{transform:translateX(16px)}
.note{font-size:14px;font-weight:700;color:#5D6470}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.frame{background:#fff;overflow:hidden;box-shadow:0 30px 60px rgba(60,50,40,.25);transform-origin:top center;flex:none}
.frame.phone{border-radius:44px;border:10px solid #1B1D22}
.frame.desk{border-radius:14px}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="seg"><button data-m="desk" class="on">Desktop 1440</button><button data-m="phone">Phone 390</button></div>
  <button class="tg" id="rm"><i></i>Reduced motion</button>
  <button class="tg" id="rp">Replay hero</button>
  <span class="note">Scroll inside the page. Tap the cards, replay buttons and FAQ.</span>
</div>
<div class="stage" id="stage"><div class="frame desk" id="frame"><iframe id="f" src="site.html" title="Spectr landing page"></iframe></div></div>
<script>
const f=document.getElementById('f'),frame=document.getElementById('frame'),stage=document.getElementById('stage');
let mode='desk',rm=false;
function fit(){
  const availW=stage.clientWidth-40, availH=stage.clientHeight-40;
  if(mode==='desk'){
    const s=Math.min(1,availW/1440);
    frame.className='frame desk';frame.style.width='1440px';frame.style.height=(availH/s)+'px';frame.style.transform='scale('+s+')';
    frame.style.marginBottom=(-(availH/s)*(1-s))+'px';
  }else{
    const h=Math.min(844+20,availH);
    frame.className='frame phone';frame.style.width='410px';frame.style.height=h+'px';frame.style.transform='none';frame.style.marginBottom='0';
  }
}
function send(m){try{f.contentWindow.postMessage(m,'*')}catch(e){}}
document.getElementById('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));fit()};
document.getElementById('rm').onclick=e=>{rm=!rm;e.currentTarget.classList.toggle('on',rm);send({spectr:'rm',on:rm})};
document.getElementById('rp').onclick=()=>send({spectr:'replay'});
addEventListener('resize',fit);fit();
</script>
</body>
</html>
