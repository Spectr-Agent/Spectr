<!doctype html><html><head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
body{margin:0;padding:24px;background:var(--surface-100);font-family:var(--font-sans);display:flex;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--radius-pill);font:600 14px/20px var(--font-sans);color:var(--on-fill)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--on-fill)}
</style></head><body>
<span class="chip" style="background:var(--clay)"><i class="dot"></i>Working</span>
<span class="chip" style="background:var(--sky)"><i class="dot"></i>Done</span>
<span class="chip" style="background:transparent;border:1px solid var(--ink);color:var(--ink)"><i class="dot" style="background:var(--ink)"></i>Waiting for you</span>
<span class="chip" style="background:var(--inverse);color:var(--on-inverse)"><i class="dot" style="background:var(--on-inverse)"></i>Stopped</span>
</body></html>
