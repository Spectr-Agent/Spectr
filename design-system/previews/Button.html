<!doctype html><html><head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
body{margin:0;padding:24px;background:var(--surface-100);font-family:var(--font-sans);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn{height:48px;padding:0 24px;border:0;border-radius:var(--radius-md);font:600 14px/20px var(--font-sans);background:var(--inverse);color:var(--on-inverse);box-shadow:var(--shadow-clay);cursor:pointer}
.btn:active{box-shadow:var(--shadow-press)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.sec{background:var(--surface-200);color:var(--ink);box-shadow:none;border:1px solid var(--border)}
.btn.ptt{border-radius:var(--radius-pill);padding:0 32px;background:var(--sky);color:var(--on-fill)}
</style></head><body>
<button class="btn">Pair this Mac</button><button class="btn sec">Not now</button><button class="btn ptt">Hold to talk</button>
</body></html>
