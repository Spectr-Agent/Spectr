<!doctype html><html><head><link rel="stylesheet" href="../tokens/tokens.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet"><style>
body{margin:0;padding:24px;background:var(--surface-100);font-family:var(--font-sans);display:flex;gap:24px;flex-wrap:wrap}
.card{width:260px;background:var(--surface-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-clay);padding:var(--space-5);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.card img{width:160px;height:160px;object-fit:contain}
h3{margin:0;font:600 20px/28px var(--font-sans);color:var(--ink)}
p{margin:0;font:400 15px/22px var(--font-sans);color:var(--ink-muted)}
.btn{margin-top:8px;height:44px;padding:0 20px;border:0;border-radius:var(--radius-md);font:600 14px var(--font-sans);cursor:pointer}
</style></head><body>
<div class="card"><img src="../assets/mascot/spectr_error.png" alt=""><h3>Spectr stalled</h3><p>The Mac stopped answering. Tap retry or pair again.</p><button class="btn" style="background:var(--inverse);color:var(--on-inverse)">Retry</button></div>
<div class="card"><img src="../assets/mascot/spectr_success.png" alt=""><h3>Slide 4 is done</h3><p>Verified in Keynote at 7:42 PM.</p><button class="btn" style="background:var(--sky);color:var(--on-fill)">View receipt</button></div>
</body></html>
